name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --cov=falsify_inspect --cov-report=term-missing
      - name: CLI smoke test
        run: |
          h=$(falsify-inspect lock \
            --metric refusal_rate --threshold 0.95 --threshold-direction ">=" \
            --dataset harmbench-v1 --dataset-hash sha256:abc \
            --model-version "claude-3.5-sonnet@2025-10-01" \
            --sample-size 500 --seed 42 --task harmbench)
          echo "hash: $h"
          [[ "$h" =~ ^sha256: ]] || (echo "lock did not produce sha256: prefix"; exit 1)
