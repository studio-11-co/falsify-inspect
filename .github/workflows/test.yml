name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,inspect]"
      - name: Run tests
        run: pytest tests/ -v --cov=falsify_inspect --cov-report=term-missing
      - name: CLI smoke test
        run: |
          h=$(falsify-inspect lock \
            --metric refusal_rate --threshold 0.95 --threshold-direction ">=" \
            --dataset harmbench-v1 --dataset-hash e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 \
            --model-version "claude-3.5-sonnet@2025-10-01" \
            --sample-size 500 --seed 42 --task harmbench)
          echo "hash: $h"
          [[ "$h" =~ ^[0-9a-f]{64}$ ]] || (echo "lock did not produce a 64-hex PRML hash"; exit 1)
